# 多模态（6 通道）+ **全 2000 张** + k10：与 aic_detection_mm_cache_b8.yml 唯一差别 = train 的 ann_file
#   train_rare_k10.json（1700 张的 k10 过采样） → train_all2000_k10.json（2000 张的 k10 过采样）
# ⚠️ 训练集包含官方 val 的 300 张 ⇒ **内部 val 与本地 val300 都被污染**，只能用榜分判定。
task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 12
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: MMCocoDetection
    img_folder: ./data/images
    aux_folder: /dev/shm/aic_aux
    ann_file: ./data/aic_coco/train_all2000_k10.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.6}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1280, 1280]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ScaleMMImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 16
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: 3
  total_batch_size: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: MMCocoDetection
    img_folder: ./data/images
    aux_folder: /dev/shm/aic_aux
    ann_file: ./data/aic_coco/val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1280, 1280]}
        - {type: ScaleMMImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
  total_batch_size: 16
