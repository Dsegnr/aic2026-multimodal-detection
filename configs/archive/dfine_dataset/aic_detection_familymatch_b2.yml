# 按"复赛测试集家族构成"重采样的数据集（train_familymatch.json，由 make_family_matched_json.py 生成）
# 与 aic_detection_rare_k10_cache_b2.yml 的唯一差别 = train 的 ann_file
task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 12
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/images
    ann_file: ./data/aic_coco/train_familymatch.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1280, 1280]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 16
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: 3
  total_batch_size: 2

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/images
    ann_file: ./data/aic_coco/val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1280, 1280]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
  total_batch_size: 4
