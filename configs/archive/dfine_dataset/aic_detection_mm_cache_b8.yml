# 多模态（6 通道）数据集：可见光 + 辅助图（红外/深度/掩码 合成 3 通道 PNG）
# 与纯 RGB 配方（aic_detection_rare_k10_cache_b8_saug.yml）的差别只有两处：
#   ① dataset.type = MMCocoDetection（多一个 aux_folder 参数）
#   ② 管线里用 ScaleMMImage 取代 ConvertPILImage（后者只吃 PIL），并**关掉 Photometric**（只对 RGB 有意义）
task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 12
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: MMCocoDetection
    img_folder: ./data/images
    aux_folder: /dev/shm/aic_aux
    ann_file: ./data/aic_coco/train_rare_k10.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.6}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1280, 1280]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ScaleMMImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 16
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: 3
  total_batch_size: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: MMCocoDetection
    img_folder: ./data/images
    aux_folder: /dev/shm/aic_aux
    ann_file: ./data/aic_coco/val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1280, 1280]}
        - {type: ScaleMMImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
  total_batch_size: 16
