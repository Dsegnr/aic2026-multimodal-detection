# Arm：D-FINE-X（B5，官方 COCO 59.3）@**1536** + k10，16 轮
# 目的：验证"容量 × 分辨率"是否互补（B4→B5 在 1280 已饱和，若 1536 下有增量，说明瓶颈确实是像素/定位）
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_rare_k10_cache_b2_1536.yml',
]

output_dir: ./output/dfine_hgnetv2_x_aic_k10_1536
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

HybridEncoder:
  hidden_dim: 384
  dim_feedforward: 2048
  eval_spatial_size: [1536, 1536]

DFINETransformer:
  feat_channels: [384, 384, 384]
  reg_scale: 8

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000025
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 16
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 12
  collate_fn:
    stop_epoch: 12
    ema_restart_decay: 0.9999

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
