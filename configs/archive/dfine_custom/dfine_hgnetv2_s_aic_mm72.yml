# 多模态融合 · 长日程版：与 s_aic_mm 逐字相同，唯一差别 = 72 轮（增广 60 轮关）
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_mm_cache_b8.yml',
]

model: MMDFINE
output_dir: ./output/dfine_hgnetv2_s_aic_mm72
eval_spatial_size: null

MMDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  aux_channels: 3
  aux_width: 64
  feat_channels: [256, 512, 1024]

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 6
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5
  eval_spatial_size: [1280, 1280]

epochs: 72
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 60
  collate_fn:
    stop_epoch: 60

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0

num_visualization_sample_batch: 0
