# Arm：D-FINE-L @**1536** + **全 2000 张** + k10 + **24 轮**（把三条已知为正/待验证的轴叠在一起）
#   ① 容量：B4（已验证有效，榜 +1.37）
#   ② 日程：16→24 轮（已验证，榜 +0.23）
#   ③ 分辨率：训练与推理同尺度 1536（待验证）
#   ④ 数据：全 2000 张（S 族 +0.03，L 上未验证）
# ⚠️ val 已并入训练 ⇒ 本地口径失效，只能靠榜分判定
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_all2000_k10_cache_b2_1536.yml',
]

output_dir: ./output/dfine_hgnetv2_l_aic_all2000_1536_24e
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

HybridEncoder:
  eval_spatial_size: [1536, 1536]

epochs: 24
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 18
  collate_fn:
    stop_epoch: 18
    ema_restart_decay: 0.9999

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
