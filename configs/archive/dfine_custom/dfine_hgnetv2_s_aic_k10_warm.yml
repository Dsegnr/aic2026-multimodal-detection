# Arm：D-FINE-S @1280 + 稀类过采样 k10 + 缓存，**48 轮**（与 54.36 那条对照臂同源）
# 唯一变量 = 分类头热启动（用公开 COCO 同义类行初始化 8/12 类）
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_rare_k10_cache_b8.yml',
]

output_dir: ./output/dfine_hgnetv2_s_aic_k10_warm
eval_spatial_size: null

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 6
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5
  eval_spatial_size: [1280, 1280]

epochs: 48
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 40
  collate_fn:
    stop_epoch: 40

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
