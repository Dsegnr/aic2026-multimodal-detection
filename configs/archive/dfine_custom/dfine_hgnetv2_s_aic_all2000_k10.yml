# Arm：D-FINE-S @1280 + **全部 2000 张官方数据** + k10 过采样 + 缓存，48 轮
# 唯一变量 = 训练数据量（把官方 val 的 300 张也放进训练集）
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_all2000_k10_cache_b8.yml',
]

output_dir: ./output/dfine_hgnetv2_s_aic_all2000_k10
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 6
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5
  eval_spatial_size: [1280, 1280]

epochs: 48
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 40
  collate_fn:
    stop_epoch: 40

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
