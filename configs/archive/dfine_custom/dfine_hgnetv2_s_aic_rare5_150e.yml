# D-FINE-S fine-tuned on the AIC2026 urban multimodal dataset (RGB only).
#
# IMPORTANT: the architecture block below is copied VERBATIM from the official
# configs/dfine/objects365/dfine_hgnetv2_s_obj2coco.yml.
# Do NOT reuse the repo's configs/dfine/custom/dfine_hgnetv2_s_custom.yml as a base:
# that template is MISSING `expansion: 0.5` in HybridEncoder, which causes a
# RuntimeError (size of tensor a (1600) must match tensor b (400)) at the encoder.
# Our checkpoint dfine_s_obj2coco.pth was trained WITH expansion 0.5.
#
# __include__ order matters: entries are applied in order and LATER ones win,
# so our dataset file goes LAST to override the 640/batch-32 defaults.

__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_rare5.yml',
]

output_dir: ./output/dfine_hgnetv2_s_aic_rare5_150e

# CRITICAL, and it MUST be at the TOP LEVEL:
# include/dfine_hgnetv2.yml sets `eval_spatial_size: [640, 640]` at top level, and both
# HybridEncoder and DFINETransformer declare `__share__ = ["eval_spatial_size"]`, i.e.
# they read the TOP-LEVEL key, not one nested inside their own block.
#
# In EVAL mode both of them take the CACHED branch and ignore the real input size:
#   encoder: if self.training or eval_spatial_size is None -> dynamic pos_embed
#            else -> use the cached one built for eval_spatial_size
#   decoder: same pattern for the pre-computed `anchors` / `valid_mask`
# Training takes the dynamic branch, but periodic validation is eval mode, so a stale
# [640, 640] makes training crash at the first validation, and inference at any
# resolution other than 640 crashes too.
#
# We set it to null => always dynamic => multi-scale TTA works. This is required:
# our TTA includes a 0.83x view, whose feature map (34x34) cannot match any fixed cache.
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5
  eval_spatial_size: [1280, 1280]

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000125
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000125
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# 2000 images only -> 72 epochs (comparable with the RT-DETR arm), not COCO's 64/132.
epochs: 150
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 130
  collate_fn:
    stop_epoch: 130
    ema_restart_decay: 0.9999
    base_size_repeat: 10

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
