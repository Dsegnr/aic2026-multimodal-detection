# 多模态融合 · 更大骨干版：官方 M 架构块（B2/384-768-1536）+ MMDFINE 融合，24 轮
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_mm_cache_b8.yml',
]

model: MMDFINE
output_dir: ./output/dfine_hgnetv2_m_aic_mm
eval_spatial_size: null

MMDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  aux_channels: 3
  aux_width: 64
  feat_channels: [384, 768, 1536]

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67
  eval_spatial_size: [1280, 1280]

epochs: 24
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 20
  collate_fn:
    stop_epoch: 20

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0

num_visualization_sample_batch: 0
