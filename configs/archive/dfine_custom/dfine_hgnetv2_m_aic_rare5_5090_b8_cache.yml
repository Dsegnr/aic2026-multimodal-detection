# D-FINE-M @1280 + 稀类过采样，**batch 8 版**（DEAP 完全退出后启用）
# 与 batch2 版唯一差别：train total_batch_size 8、val 8、输出目录带 _b8。
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_rare5_5090_b8_cache.yml',
]

output_dir: ./output/dfine_hgnetv2_m_aic_rare5_5090_b8
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000125
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000125
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 72
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 64
  collate_fn:
    stop_epoch: 64
    ema_restart_decay: 0.9999
    base_size_repeat: 3

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
