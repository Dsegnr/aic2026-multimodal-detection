# Arm：D-FINE-X（B5，官方 COCO 59.3）@1280 + k10 + **24 轮**
# 依据：X 在 16 轮时 4 视图已达 58.19（与 L 的 58.42 基本持平，说明它还没吃满日程）；
#       L 上"16→24 轮"曾拿到榜 +0.23 ⇒ 给 X 同样拉长到 24 轮，验证它的容量是否在长日程下兑现。
# 1536 轴已被实测判负（见 156/157 节），所以本臂固定在 1280。
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_familymatch_b2.yml',
]

output_dir: ./output/dfine_hgnetv2_x_aic_familymatch_72e
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

HybridEncoder:
  hidden_dim: 384
  dim_feedforward: 2048
  eval_spatial_size: [1280, 1280]

DFINETransformer:
  feat_channels: [384, 384, 384]
  reg_scale: 8

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000025
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 72
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 54
  collate_fn:
    stop_epoch: 54
    ema_restart_decay: 0.9999

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
