# Arm：D-FINE-S @1280 + 稀类过采样 k10 + **增广加强（域随机化）**，**48 轮**（与榜验证配方的步数对齐）
# 唯一变量 = 增广强度（PhotometricDistort 0.5→0.9、IoUCrop 0.8→1.0）；其余与 50.117 配方逐字相同。
__include__: [
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
  '../../dataset/aic_detection_rare_k10_cache_b8_saug.yml',
]

output_dir: ./output/dfine_hgnetv2_s_aic_k10_saug48
eval_spatial_size: null

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 6
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5
  eval_spatial_size: [1280, 1280]

epochs: 48
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 40
  collate_fn:
    stop_epoch: 40

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
